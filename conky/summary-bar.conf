-- vim: ft=conkyrc noexpandtab

local hostname = io.popen("hostname"):read("*a"):gsub("%s+", "")
local sections = dofile(os.getenv("HOME") .. "/dotfiles/conky/sections.lua")
local minimum_width, maximum_width, font, after_cal_voffset

if hostname == "ArchDiamond" then
	minimum_width = 480
	maximum_width = 480
	font = "Exo 2:size=13"
	font1 = "Exo 2:semibold:size=15" -- whoami
	font2 = "DejaVu Sans Mono:size=15" -- main monospace font
	font3 = "Sarasa Mono K:size=15" -- agenda monospace font
	font6 = "Noto Sans Mono CJK KR:bold:size=18" -- current events in the agenda
	after_cal_voffset = [[${voffset -242}]]
elseif hostname == "ArchScythe" or hostname == "ArchUmi" then
	minimum_width = 360
	maximum_width = 360
	font = "Exo 2:size=9"
	font1 = "Exo 2:semibold:size=11" -- whoami
	font2 = "DejaVu Sans Mono:size=11" -- main monospace font
	font3 = "Sarasa Mono K:size=10.5" -- agenda monospace font
	font6 = "Noto Sans Mono CJK KR:bold:size=16" -- current events in the agenda
	after_cal_voffset = [[${voffset -160}]]
else
	minimum_width = 420
	maximum_width = 420
	font = "Exo 2:size=11"
	font1 = "Exo 2:semibold:size=13" -- whoami
	font2 = "DejaVu Sans Mono:size=13" -- main monospace font
	font3 = "Sarasa Mono K:size=13.5" -- agenda monospace font
	font6 = "Noto Sans Mono CJK KR:bold:size=18" -- current events in the agenda
	after_cal_voffset = [[${voffset -236}]]
end
font4 = font3 .. ":bold" -- bold for today in the calendar, and the time

if hostname == "ArchMillie" then
	alignment = "top_left"
else
	alignment = "top_right"
end

conky.config = dofile(os.getenv("HOME") .. "/dotfiles/conky/common.lua")({
	alignment = alignment,
	border_width = 10,
	gap_x = 20,
	gap_y = 15,
	minimum_width = minimum_width,
	maximum_width = maximum_width,
	update_interval = 10,
	xinerama_head = 3,
	font = font,
	font1 = font1,
	font2 = font2,
	font3 = font3,
	font4 = font4,
	font6 = font6,
})

conky.text = [[
### CAL AND HOSTNAME
${color7}${offset 10}${font1}${execi 999999999 whoami}@${nodename}
${color7}${voffset -5}${offset 10}${cpubar cpu0 0, 180}${voffset -5}
${font3}${color1}${execpi 60 ~/dotfiles/conky/ascii-cal.sh}
${font2}GPG: ${execpi 60 ~/dotfiles/sh-scripts/gpg-status.sh --conky}
]] .. after_cal_voffset .. [[
${alignr}${font4}${color9}${offset -50}${execi 60 LC_TIME=ko_KR.UTF-8 date +%A}
${alignr}${offset -50}${time %H:%M} ${font}
${font3}${execpi 90 ~/dotfiles/conky/otis-vitals.py}
${voffset 25}
### TASK WARRIOR
${font1}${color1}[ Tasks ] ${voffset 2}${hr 2}${font3}
${execpi 30 ~/dotfiles/conky/print-conky-tasks.sh}
${voffset 5}
### CALENDAR VIEW: CURRENT EVENT, TODAY, UPCOMING
${execpi 30 ~/dotfiles/conky/agenda.py}
${voffset 5}
### PROJECTS
${font1}${color1}[ Projects ] ${voffset 2}${hr 2}${font3}${color3}
${execpi 30 ~/dotfiles/conky/print-conky-projects.sh}
]]

-- TODO: this doesn't support relative font sizes at the moment
if hostname == "ArchScythe" or hostname == "ArchUmi" then
	conky.text = conky.text
		.. [[
### CPU
${voffset 10}${font5}${color1}[ CPU ] ${voffset 2}${hr 2}${voffset 0}$color
${voffset -35}${alignr}${color2}${font Exo 2:light:size=16}${freq_g}GHz@${acpitemp}${font Exo 2:semibold:size=13}°C
${voffset 7}${alignr}${color7}${font Exo 2:size=20} ${cpu cpu0}% ${cpugraph 32,240}
${voffset -40}${color9}${font DejaVu Sans:light:size=12}${goto 175}Uptime: ${uptime}
### TOP CPU PROCESSES
${voffset 25}${font Exo 2:bold:size=9}${color8}PROCESS (${processes}) ${goto 155}${color6}CPU%${color8}${goto 220}MEM${goto 290}PID
${voffset -10}${color0}${stippled_hr}${voffset -2}
]] .. sections.top_cpu .. [[
### TOP MEM PROCESSES
]] .. sections.memory .. [[
${voffset 10}${color DA9BE3}PROCESS (${processes}) ${goto 160}${color1}MEM${color DA9BE3}${goto 220}MEM%${goto 290}PID
${voffset -10}${color0}${stippled_hr}${voffset -2}
]] .. sections.top_mem .. [[
### DISK
${voffset 5}${font5}${color1}[ Disk ] ${voffset 2}${hr 2}$color${font}
]] .. sections.disk(2, "/", "/") .. sections.disk(-2, "~", "/home") .. [[
### VERSION
${voffset -10}${color0}${stippled_hr}
${voffset -10}${font Exo 2:light:size=10}${conky_version}
]]
end
