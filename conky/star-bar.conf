-- vim: ft=conkyrc noexpandtab

conky.config = dofile(os.getenv("HOME") .. "/dotfiles/conky/common.lua")({
	alignment = "top_right",
	border_width = 10,
	font = "Exo 2:size=9:semibold",
	gap_x = 30,
	gap_y = 15,
	minimum_width = 360,
	maximum_width = 360,
	update_interval = 10,
	xinerama_head = 0,
})

conky.text = [[
### CAL AND HOSTNAME
${color7}${voffset -9}${offset 10}${font Exo 2:size=14}${execi 999999999 whoami}@${nodename}
${color7}${voffset -5}${offset 10}${cpubar cpu0 0, 220}${voffset 2}
${font DejaVu Sans Mono:size=12}${color1}${execpi 60 JOUR=`date +%e`; cal | sed '1d' | sed 's/^/ /g' | sed 's/$/ /g' | sed /" $JOUR "/s/" $JOUR "/" "'${font DejaVu Sans Mono:size=12:bold}${color ffffff}'"$JOUR"'${font DejaVu Sans Mono:size=12}${color bbbbbb}'" "/}
${voffset -170}
${execpi 30 ~/dotfiles/conky/ascii-clock.py}
${font Sarasa Mono K:bold:size=13}${color9}${voffset -90}${goto 265}${execi 60 LC_TIME=ko_KR.UTF-8 date +%A}
${goto 265}${time %H:%M}${font}${voffset 45}
### Microphone status
${voffset 10}
${font Exo 2:semibold}${color1}[ Mic ] ${voffset 2}${hr 2}${voffset 0}$color
${execibar 10 wpctl get-volume @DEFAULT_SOURCE@ | awk '{print $2*100}'}
${voffset -2}${font Exo 2:semibold:size=16}${alignr}${execpi 1 if wpctl get-volume @DEFAULT_SOURCE@ | grep -q MUTED; then echo "\${color ff9999}[Muted!]";fi}
${voffset 5}
### CPU
${font Exo 2:semibold}${color1}[ CPU ] ${voffset 2}${hr 2}${voffset 0}$color
${voffset -35}${alignr}${color2}${font Exo 2:light:size=16}${freq_g}GHz@${acpitemp}${font Exo 2:semibold:size=13}°C
${voffset 7}${alignr}${color7}${font Exo 2:size=20} ${cpu cpu0}% ${voffset 2} ${cpugraph 32,240}
${voffset -40}${color9}${font DejaVu Sans:light:size=12}${goto 175}Uptime: ${uptime}
### TOP CPU PROCESSES
${voffset 5}${font Exo 2:bold:size=9}${color8}PROCESS (${processes}) ${goto 155}${color6}CPU%${color8}${goto 220}MEM${goto 290}PID
${voffset -10}${color0}${stippled_hr}${voffset -2}
${color4}${top name 1} ${goto 150}${top cpu 1}%${goto 220}${top mem_res 1}${goto 290}${top_mem pid 1}
${color5}${top name 2} ${goto 150}${top cpu 2}%${goto 220}${top mem_res 2}${goto 290}${top_mem pid 2}
${color6}${top name 3} ${goto 150}${top cpu 3}%${goto 220}${top mem_res 3}${goto 290}${top_mem pid 3}
${color6}${top name 4} ${goto 150}${top cpu 4}%${goto 220}${top mem_res 4}${goto 290}${top_mem pid 4}
${color6}${top name 5} ${goto 150}${top cpu 5}%${goto 220}${top mem_res 5}${goto 290}${top_mem pid 5}
### GPU
${voffset 8}${font Exo 2:semibold}${color1}[ GPU ] ${voffset 2}${hr 2}${voffset 0}$color
${voffset 3}${font Exo 2:size=16}${execpi 10 ~/dotfiles/conky/gpu-load.sh}
### TOP MEM PROCESSES
${voffset 5}${font Exo 2:semibold}${color1}[ Memory ] ${voffset 2}${hr 2}${voffset 10}$color
${goto 100}${color DAC0DE}${voffset -8}${font Exo 2:bold:size=20}${mem}${color3}${goto 230}${voffset 4}${memgauge 19,40} ${color DAC0DE}${voffset -4}${font Exo 2:bold:size=14}$memperc%
${goto 111}${color2}${font Exo 2:bold:size=14} / ${memmax}$font${alignr}${membar 12,105}
${voffset 10}${color DA9BE3}PROCESS (${processes}) ${goto 160}${color1}MEM${color DA9BE3}${goto 220}MEM%${goto 290}PID
${voffset -10}${color0}${stippled_hr}${voffset -2}
${color2}${top_mem name 1} ${goto 150}${top_mem mem_res 1}${goto 220}${top_mem mem 1}%${goto 290}${top_mem pid 1}
${color1}${top_mem name 2} ${goto 150}${top_mem mem_res 2}${goto 220}${top_mem mem 2}%${goto 290}${top_mem pid 2}
${color3}${top_mem name 3} ${goto 150}${top_mem mem_res 3}${goto 220}${top_mem mem 3}%${goto 290}${top_mem pid 3}
${color3}${top_mem name 4} ${goto 150}${top_mem mem_res 4}${goto 220}${top_mem mem 4}%${goto 290}${top_mem pid 4}
${color3}${top_mem name 5} ${goto 150}${top_mem mem_res 5}${goto 220}${top_mem mem 5}%${goto 290}${top_mem pid 5}
