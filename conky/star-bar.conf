-- vim: ft=conkyrc noexpandtab

local sections = dofile(os.getenv("HOME") .. "/dotfiles/conky/sections.lua")

conky.config = dofile(os.getenv("HOME") .. "/dotfiles/conky/common.lua")({
	alignment = "top_right",
	border_width = 10,
	font = "Exo 2:size=9:semibold",
	gap_x = 30,
	gap_y = 15,
	minimum_width = 360,
	maximum_width = 360,
	update_interval = 10,
	xinerama_head = 0,
	font3 = "Sarasa Mono K:size=12", -- calendar
	font4 = "Sarasa Mono K:bold:size=12", -- today in the calendar
})

conky.text = [[
### CAL AND HOSTNAME
${color7}${voffset -9}${offset 10}${font Exo 2:size=14}${execi 999999999 whoami}@${nodename}
${color7}${voffset -5}${offset 10}${cpubar cpu0 0, 220}${voffset 2}
${font3}${color1}${execpi 60 ~/dotfiles/conky/ascii-cal.sh}
${voffset -170}
${execpi 30 ~/dotfiles/conky/ascii-clock.py 12 240}
${font Sarasa Mono K:bold:size=13}${color9}${voffset -90}${goto 275}${execi 60 LC_TIME=ko_KR.UTF-8 date +%A}
${goto 275}${time %H:%M}${font}${voffset 45}
### Microphone status
${voffset 10}
${font5}${color1}[ Mic ] ${voffset 2}${hr 2}${voffset 0}$color
${execibar 10 wpctl get-volume @DEFAULT_SOURCE@ | awk '{print $2*100}'}
${voffset -2}${font Exo 2:semibold:size=16}${alignr}${execpi 1 if wpctl get-volume @DEFAULT_SOURCE@ | grep -q MUTED; then echo "\${color ff9999}[Muted!]";fi}
${voffset 5}
### CPU
${font5}${color1}[ CPU ] ${voffset 2}${hr 2}${voffset 0}$color
${voffset -35}${alignr}${color2}${font Exo 2:light:size=16}${freq_g}GHz@${acpitemp}${font Exo 2:semibold:size=13}°C
${voffset 7}${alignr}${color7}${font Exo 2:size=20} ${cpu cpu0}% ${voffset 2} ${cpugraph 32,240}
${voffset -40}${color9}${font DejaVu Sans:light:size=12}${goto 175}Uptime: ${uptime}
### TOP CPU PROCESSES
${voffset 5}${font Exo 2:bold:size=9}${color8}PROCESS (${processes}) ${goto 155}${color6}CPU%${color8}${goto 220}MEM${goto 290}PID
${voffset -10}${color0}${stippled_hr}${voffset -2}
]] .. sections.top_cpu .. [[
### GPU
]] .. sections.gpu .. [[
### TOP MEM PROCESSES
]] .. sections.memory .. [[
${voffset 10}${color DA9BE3}PROCESS (${processes}) ${goto 160}${color1}MEM${color DA9BE3}${goto 220}MEM%${goto 290}PID
${voffset -10}${color0}${stippled_hr}${voffset -2}
]] .. sections.top_mem .. [[
### DISK
${voffset 5}${font5}${color1}[ Disk ] ${voffset 2}${hr 2}$color${font}
]] .. sections.disk(6, "/", "/") .. sections.disk(2, "~", "/home") .. [[
### Reminders
${voffset 5}${font5}${color1}[ Twitch reminder checklist ] ${voffset 2}${hr 2}$color${font}
${color9}${font Exo 2}* Both audio bars show up
* Camera is sync'ed
* Hair isn't messed up
* Green screen is working
* Chat not blocking anything
* YouTube intro/outros
### VERSION
${color0}${stippled_hr}
${voffset -5}${font Exo 2:light:size=10}${conky_version}
]]
