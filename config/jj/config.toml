"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[user]
name = "Evan Chen"
email = "evan@evanchen.cc"

[signing]
behavior = "own"
backend = "gpg"
backends.gpg.program = "gpg2"

[ui]
default-command = "status"
diff-formatter = "delta"
pager = "delta"

[merge-tools]
delta.diff-expected-exit-codes = [0, 1]

[aliases]
ls = ["log", "-r", "::@", "-n", "16"]
